<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Criar conta · Omega</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/auth.css?v=20261006-2">
</head>
<body>
<header class="site-header">
<div class="shell nav-inner">
<a class="brand" href="index.html"><span class="brand-mark">Ω</span><span>Omega <small>Gestão de contratos</small></span></a>
<div class="nav-actions">
<span class="theme-slot" hidden></span>
<a class="btn btn--inverse" href="login.html">Entrar</a>
</div>
</div>
</header>

<main class="auth-main">
<div class="shell auth-layout">
<div class="auth-copy">
<h1>Criar conta</h1>
<p>Cadastro para funcionários da equipe de gestão.</p>
</div>

<div class="auth-panel">
<div class="alert alert-erro" id="erro" hidden></div>

<form id="form-registrar" novalidate>
<div class="field">
<label for="nome">Nome completo</label>
<input type="text" id="nome" autocomplete="name" required>
</div>
<div class="field">
<label for="email">E-mail</label>
<input type="email" id="email" autocomplete="email" required>
</div>
<div class="field">
<label for="senha">Senha</label>
<input type="password" id="senha" autocomplete="new-password" minlength="6" required>
<small>Mínimo de 6 caracteres.</small>
</div>
<div class="field">
<label for="confirmar">Confirmar senha</label>
<input type="password" id="confirmar" autocomplete="new-password" required>
</div>
<button class="btn btn--primary btn--block" type="submit">Criar conta</button>
</form>

<p class="auth-foot">Já tem conta? <a href="login.html">Entrar</a></p>
</div>
</div>
</main>

<script src="js/common.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
