<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrar · Gestor de Contratos</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem("tema") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");</script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="nav-inner">
      <a class="brand" href="index.html"><span class="brand-mark">GC</span> Gestor de Contratos</a>
      <div class="nav-actions">
        <span class="theme-slot"></span>
        <a class="btn btn-ghost" href="index.html">Voltar</a>
        <a class="btn btn-outline" href="login.html">Login</a>
      </div>
    </div>
  </header>

  <main class="page-center">
    <div class="card auth-card">
      <h1>Criar conta</h1>
      <p class="muted">Cadastro para funcionários da equipe de gestão.</p>

      <div class="alert alert-erro" id="erro" hidden></div>

      <form id="form-registrar" novalidate>
        <div class="field">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="senha">Senha</label>
          <input type="password" id="senha" autocomplete="new-password" minlength="6" required>
          <small>Mínimo de 6 caracteres.</small>
        </div>
        <div class="field">
          <label for="confirmar">Confirmar senha</label>
          <input type="password" id="confirmar" autocomplete="new-password" required>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Criar conta</button>
      </form>

      <p class="auth-foot">Já tem conta? <a href="login.html">Entrar</a></p>
    </div>
  </main>

  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
