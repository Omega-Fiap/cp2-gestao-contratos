<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Novo contrato · Omega</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=20261006-3">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html"><span class="brand-mark">Ω</span><span>Omega <small>Gestão de contratos</small></span></a>
      <div class="topbar-actions">
        <span class="theme-slot" hidden></span>
        <a class="btn btn-ghost btn-sm" href="dashboard.html">Voltar ao painel</a>
      </div>
    </div>
  </header>

  <main class="form-wrap">
    <div id="area-form">
      <h1>Novo contrato</h1>
      <p class="muted">Preencha os dados para registrar o contrato na sua carteira.</p>

      <div class="alert alert-erro" id="erro" hidden></div>

      <form id="form-contrato" novalidate>
        <section class="card">
          <h2>Dados do cliente</h2>
          <div class="grid-2">
            <div class="field">
              <label for="c-nome">Nome / Razão social <span class="req">*</span></label>
              <input type="text" id="c-nome" required>
            </div>
            <div class="field">
              <label for="c-tipo">Tipo</label>
              <select id="c-tipo">
                <option value="">Selecione</option>
                <option>Pessoa Física</option>
                <option>Pessoa Jurídica</option>
              </select>
            </div>
            <div class="field">
              <label for="c-documento">CPF / CNPJ</label>
              <input type="text" id="c-documento" inputmode="numeric">
            </div>
            <div class="field">
              <label for="c-telefone">Telefone</label>
              <input type="tel" id="c-telefone">
            </div>
          </div>
          <div class="field">
            <label for="c-email">E-mail</label>
            <input type="email" id="c-email">
          </div>
        </section>

        <section class="card">
          <h2>Dados do contrato</h2>
          <div class="field">
            <label for="t-titulo">Título do contrato <span class="req">*</span></label>
            <input type="text" id="t-titulo" required>
          </div>
          <div class="grid-2">
            <div class="field">
              <label for="t-tipo">Tipo de contrato</label>
              <select id="t-tipo">
                <option value="">Selecione</option>
                <option>Prestação de serviços</option>
                <option>Compra e venda</option>
                <option>Locação</option>
                <option>Fornecimento</option>
                <option>Parceria</option>
                <option>Outro</option>
              </select>
            </div>
            <div class="field">
              <label for="t-valor">Valor total (R$)</label>
              <input type="number" id="t-valor" min="0" step="0.01" placeholder="0,00">
            </div>
            <div class="field">
              <label for="t-inicio">Data de início <span class="req">*</span></label>
              <input type="date" id="t-inicio" required>
            </div>
            <div class="field">
              <label for="t-fim">Data de término</label>
              <input type="date" id="t-fim">
            </div>
          </div>
        </section>

        <section class="card">
          <h2>Cláusulas <span class="opcional">(opcional)</span></h2>
          <div id="lista-clausulas"></div>
          <button type="button" class="btn btn-outline btn-sm" id="btn-add-clausula">+ Adicionar cláusula</button>
        </section>

        <div class="form-actions">
          <button class="btn btn-primary btn-lg btn-block" type="submit" id="btn-enviar">Registrar contrato</button>
        </div>
      </form>
    </div>

    <section class="card sucesso" id="area-sucesso" hidden>
      <div class="check">✓</div>
      <h1>Contrato registrado</h1>
      <p class="muted">Recebemos o contrato. Guarde o número abaixo para acompanhamento.</p>
      <div class="numero" id="numero-contrato"></div>
      <div class="acoes-sucesso">
        <button class="btn btn-primary" id="btn-outro">Registrar outro contrato</button>
        <a class="btn btn-outline" href="dashboard.html">Ir para o painel</a>
      </div>
    </section>
  </main>

  <script src="js/common.js"></script>
  <script src="js/formulario.js"></script>
</body>
</html>
