<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login · Gestor de Contratos</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem("tema") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");</script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="nav-inner">
      <a class="brand" href="index.html"><span class="brand-mark">GC</span> Gestor de Contratos</a>
      <div class="nav-actions">
        <span class="theme-slot"></span>
        <a class="btn btn-ghost" href="index.html">Voltar</a>
        <a class="btn btn-primary" href="registrar.html">Registrar</a>
      </div>
    </div>
  </header>

  <main class="page-center">
    <div class="card auth-card">
      <h1>Entrar</h1>
      <p class="muted">Acesse o painel de gestão de contratos.</p>

      <div class="alert alert-ok" id="aviso" hidden>Cadastro realizado! Faça login para continuar.</div>
      <div class="alert alert-erro" id="erro" hidden></div>

      <form id="form-login" novalidate>
        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="senha">Senha</label>
          <input type="password" id="senha" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Entrar</button>
      </form>

      <p class="auth-foot">Ainda não tem conta? <a href="registrar.html">Registre-se</a></p>
    </div>
  </main>

  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
